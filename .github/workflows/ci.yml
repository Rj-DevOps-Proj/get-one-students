name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  BACKEND_DIR: ./
  DOCKER_REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}/devops_testing
  IMAGE_NAME: 'get-one-student-service'
  IMAGE_TAG: ${{ github.sha }}

defaults:
  run:
    shell: bash

jobs:
  stage-1-test:
    name: Python tests
    runs-on: [self-hosted, linux]
    services:
      postgres:
        image: postgres:19-alpine
        env:
          POSTGRES_USER: student_test
          POSTGRES_PASSWORD: student_test
          POSTGRES_DB: student_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U student_test -d student_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          source "$HOME/master/bin/activate"
          python --version
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt pytest

      - name: Run unit tests
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          TEST_DATABASE_URL: postgresql://student_test:student_test@localhost:${{ job.services.postgres.ports[5432] }}/student_test
        run: |
          source "$HOME/master/bin/activate"
          python -m pytest -q

  stage-2-sonar:
    name: Sonar analysis
    needs: stage-1-test
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Python version
        run: |
          source "$HOME/master/bin/activate"
          echo "PYTHON_VERSION=$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" >> "$GITHUB_ENV"

      - name: SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=app.py,services
            -Dsonar.tests=test_app.py
            -Dsonar.test.inclusions=**/test*.py
            -Dsonar.python.version=${{ env.PYTHON_VERSION }}
            -Dsonar.exclusions=**/__pycache__/**,**/.venv/**,**/data/**,**/__init__.py

  stage-3-build-scan-push:
    name: Build, scan, and push image
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -t "${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_TAG }}" "${{ env.BACKEND_DIR }}"
          docker tag "${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_TAG }}" "${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_NAME }}-latest"
      
      #- name: Scan Docker image with Trivy
      #  uses: aquasecurity/trivy-action@v0.36.0
      #  with:
      #    image-ref: ${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_TAG }}
      #    format: table
      #    exit-code: '1'
      #    ignore-unfixed: true
      #    vuln-type: os,library
      #    severity: CRITICAL,HIGH

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker images
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: docker push "${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_NAME }}-latest"

      - name: Clean up local images
        if: always()
        run: |
          docker image rm "${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_TAG }}" >/dev/null 2>&1 || true
          docker image rm "${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_NAME }}-latest" >/dev/null 2>&1 || true
